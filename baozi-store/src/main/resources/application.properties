spring.application.name=baozi-store
# Perfil padrao: H2 em memoria (permitido pelo enunciado)
spring.datasource.url=jdbc:h2:mem:baozi;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Console H2 desativado por seguranca
spring.h2.console.enabled=false
# Nao expor detalhes internos em respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
