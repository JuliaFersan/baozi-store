# Uso: SPRING_PROFILES_ACTIVE=mysql
# Credenciais vem de variaveis de ambiente (nunca hardcoded no repositorio)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:baozi}
